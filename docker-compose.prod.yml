# Production Docker Compose for FairPass
# This file is used for production deployments

name: fairpass-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: fairpass-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fairpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fairpass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fairpass} -d ${POSTGRES_DB:-fairpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fairpass-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fairpass-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fairpass-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-fairpass}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fairpass}
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - AUTH_SECRET=${AUTH_SECRET}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/trpc/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  ai-engine:
    build:
      context: .
      dockerfile: apps/ai-engine/Dockerfile
    container_name: fairpass-ai-engine
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-fairpass}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fairpass}
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - FAIRPASS_EMBEDDING_PROVIDER=${FAIRPASS_EMBEDDING_PROVIDER:-local}
      - FAIRPASS_QUERY_EXTRACTOR=${FAIRPASS_QUERY_EXTRACTOR:-local}
      - FAIRPASS_OPENAI_API_KEY=${FAIRPASS_OPENAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
