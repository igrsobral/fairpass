name: fairpass

# NOTE: Host ports are non-standard (5433/6380/6335) to avoid colliding with
# the SSH-tunneled dev services already bound to 5432/6379/6333 on this machine.

services:
  postgres:
    image: postgres:16-alpine
    container_name: fairpass-postgres
    environment:
      POSTGRES_USER: fairpass
      POSTGRES_PASSWORD: fairpass
      POSTGRES_DB: fairpass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairpass -d fairpass"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fairpass-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fairpass-qdrant
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # No curl/wget in the qdrant image; bash TCP probe hits /readyz.
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  qdrant-data: