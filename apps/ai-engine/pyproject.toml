[project]
name = "fairpass-ai-engine"
version = "0.1.0"
description = "FairPass AI engine: hybrid search, reranking, and the LangGraph matchmaking agent."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.115",
    "openai>=3.5.0",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.19.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairpass"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
